services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-otforum}
      MARIADB_USER: ${DB_USER:-otforum}
      MARIADB_PASSWORD: ${DB_PASSWORD:-otforum}
    volumes:
      - db-data:/var/lib/mysql
      # Alla .sql-filer här körs automatiskt forsta gangen databasen skapas
      - ./sql:/docker-entrypoint-initdb.d:ro

  site:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-otforum}
      DB_USER: ${DB_USER:-otforum}
      DB_PASSWORD: ${DB_PASSWORD:-otforum}
    volumes:
      - ./html:/var/www/html

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

volumes:
  db-data:
